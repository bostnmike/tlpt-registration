name: Publish registration

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: registration-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read the publication request
        uses: actions/checkout@v4
        with:
          path: publisher
          persist-credentials: false
      - name: Choose the canonical source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          revision=main
          if [[ "$GITHUB_EVENT_NAME" == push && -f publisher/source-revision.txt ]]; then
            revision=$(cat publisher/source-revision.txt)
            [[ "$revision" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid source revision'; exit 1; }
          fi
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Read the canonical registration source
        uses: actions/checkout@v4
        with:
          repository: bostnmike/TLPT-poker
          ref: ${{ steps.source.outputs.revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate the working form and static hosting
        working-directory: source
        run: |
          node scripts/test-register-page.mjs
          node --test registration-domain/tests/*.test.mjs
      - name: Build only registration (no cashier or other sites)
        run: |
          node source/registration-domain/build.mjs "$GITHUB_WORKSPACE/public"
          git -C source rev-parse HEAD > public/source-revision.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify HTTPS remains enforced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # HTTPS was enabled once in Pages settings. The deployment token can
          # read that setting, but cannot rewrite repository settings.
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.https_enforced' | grep -qx true
